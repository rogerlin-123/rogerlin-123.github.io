const questionsData = [
  {
    "id": 1,
    "q_en": "Which static routing parameter will silently drop the packet if it is set as the next hop?",
    "options": [
      "A. Reject",
      "B. Resolve",
      "C. Readvertise",
      "D. Discard"
    ],
    "answer": "D",
    "explanation": "<div class=\"explanation-body\"><p>When the discard option is configured as the next hop for a static route, it silently drops any packets that match the route without sending any notification to the sender.</p><p><strong>Step-by-Step Breakdown:</strong></p><ul><li><strong>Discard Behavior:</strong> If a route uses the discard next hop, the router drops the packet without generating any ICMP message or error back to the sender. This is useful for creating null routes to prevent routing loops or blackhole traffic intentionally.</li><li><strong>Reject vs. Discard:</strong> The reject next hop, in contrast, drops the packet but sends an ICMP Destination Unreachable message back to the source.</li></ul><p><strong>Juniper Reference:</strong> Static Route Behavior: In Junos, the discard option ensures packets matching a static route are dropped silently, providing a way to discard traffic without alerting the source.</p></div>",
    "images": []
  },
  {
    "id": 2,
    "q_en": "In the Junos OS, which feature is used to create an alternate next hop with a unique preference for a static route?",
    "options": [
      "A. Preference",
      "B. Resolve",
      "C. Next-hop",
      "D. Qualified-next-hop"
    ],
    "answer": "D",
    "explanation": "<div class=\"explanation-body\"><p>In Junos OS, the qualified-next-hop feature is used to specify an alternate next hop for a static route, along with a unique preference value.</p><p><strong>Step-by-Step Breakdown:</strong></p><ul><li><strong>Qualified-Next-Hop:</strong> A qualified-next-hop allows you to define multiple next hops for a static route, each with its own preference. This provides flexibility by allowing the router to choose the best available next hop based on reachability and preference.</li><li><strong>Use Case:</strong> If the primary next hop becomes unreachable, the router can automatically switch to the alternate next hop defined by the qualified-next-hop with a higher preference value.</li><li><strong>Command Example:</strong> <code>set routing-options static route 10.10.10.0/24 qualified-next-hop 192.168.1.1 preference 5</code><br><code>set routing-options static route 10.10.10.0/24 qualified-next-hop 192.168.1.2 preference 10</code></li><li><strong>Preference:</strong> The next hop with the lowest preference is chosen first. If it becomes unavailable, the router will use the higher preference next hop.</li></ul><p><strong>Juniper Reference:</strong> Qualified-Next-Hop: This feature is used to configure backup or alternate next hops for static routes in Juniper devices.</p></div>",
    "images": []
  },
  {
    "id": 3,
    "q_en": "Referring to the exhibit, which statement is correct?",

    "answer": "B",
    "explanation": "<div class=\"explanation-body\"><p>In the exhibit, BGP is configured with local AS 65101 and a neighbor at 172.16.1.1 in peer AS 65201. This setup involves two different Autonomous Systems (AS), indicating an External BGP (EBGP) configuration.</p><p><strong>Step-by-Step Breakdown:</strong></p><ul><li><strong>EBGP vs. IBGP:</strong> EBGP is used between routers in different ASes. In this case, the local AS is 65101 and the peer AS is 65201, meaning the BGP session is EBGP. IBGP is used between routers within the same AS, which is not applicable here as the AS numbers are different.</li><li><strong>BGP Group Configuration:</strong> The configuration does not require a type external parameter because Junos OS automatically recognizes the session as EBGP when the local and peer AS numbers are different. The BGP session will operate as EBGP, and the configuration will commit successfully.</li></ul><p><strong>Juniper Reference:</strong> BGP Configuration: In Juniper, EBGP is automatically recognized when the local and peer AS numbers differ, without needing to specify type external.</p></div>",
    "images": [
      "q3.jpg"
    ]

  {
    "id": 4,
    "q_en": "Which two statements about IBGP are correct? (Choose two.)",
    "options": [
      "A. By default, IBGP has a TTL of 1.",
      "B. IBGP uses AS path for loop prevention.",
      "C. By default, IBGP has a TTL of 255.",
      "D. IBGP uses full mesh for loop prevention."
    ],
    "answer": "C, D",
    "explanation": "<div class=\"explanation-body\"><p>IBGP (Internal Border Gateway Protocol) is used to exchange routing information between routers within the same AS (Autonomous System).</p><p><strong>Step-by-Step Breakdown:</strong></p><ul><li><strong>TTL of 255:</strong> By default, IBGP sessions are established with a TTL (Time to Live) value of 255. This allows IBGP neighbors to communicate over multiple hops within the AS without requiring any additional configuration.</li><li><strong>Full Mesh Requirement:</strong> IBGP requires a logical full mesh between all IBGP routers to ensure that routing information is fully distributed within the AS. Since IBGP does not propagate routes learned from one IBGP peer to another by default, a full mesh topology is needed unless route reflectors or BGP confederations are used.</li></ul><p><strong>Juniper Reference:</strong> IBGP Full Mesh: Juniper recommends using route reflectors in large networks to simplify IBGP full-mesh requirements.</p></div>",

  },
  {
    "id": 5,
    "q_en": "Which statement is correct about areas in OSPF?",
    "options": [
      "A. An OSPF area is used to segment Layer 2 broadcast domains.",

    ],
    "answer": "C",
    "explanation": "<div class=\"explanation-body\"><p>In OSPF (Open Shortest Path First), areas are used to segment a network into smaller, more manageable pieces to improve scalability. By dividing a network into areas, OSPF can reduce the size of the link-state database (LSDB), which helps routers process updates more efficiently.</p><p><strong>Step-by-Step Breakdown:</strong></p><ul><li><strong>Purpose of OSPF Areas:</strong> OSPF areas allow for hierarchical routing within the OSPF domain. Routers in the same area have identical LSDBs, but routers in different areas do not exchange full link-state information. Instead, they exchange summarized routes, which reduces the LSDB size and CPU/memory usage.</li><li><strong>Benefits:</strong> Reducing the LSDB size improves scalability and ensures faster convergence in larger networks. Area 0 is the backbone area, and all other areas must connect to it, forming a hierarchical structure.</li></ul><p><strong>Juniper Reference:</strong> OSPF Configuration: Areas in OSPF are configured to optimize network performance by limiting the scope of link-state advertisements (LSAs) to within an area.</p></div>",

  {
    "id": 6,
    "q_en": "Which state in the adjacency process do OSPF routers check the MTU size?",
    "options": [

      "B. Exchange",
      "C. Done",
      "D. ExStart"
    ],
    "answer": "B",
    "explanation": "<div class=\"explanation-body\"><p>In OSPF, routers exchange link-state information in different stages to establish full adjacency. The MTU size is checked during the Exchange state.</p><p><strong>Step-by-Step Breakdown:</strong></p><ul><li><strong>OSPF Adjacency Process:</strong> OSPF routers go through multiple stages when forming an adjacency: Down, Init, 2-Way, ExStart, Exchange, Loading, and Full.</li><li><strong>Exchange State:</strong> During the Exchange state, OSPF routers exchange Database Description (DBD) packets to describe their link-state databases. The MTU size is checked at this stage to ensure both routers can successfully exchange these packets without fragmentation.</li><li>If there is an MTU mismatch, the routers may fail to proceed past the Exchange state.</li></ul><p><strong>Juniper Reference:</strong> MTU Checking in OSPF: Junos uses the Exchange state to check for MTU mismatches, ensuring that routers can properly exchange database information without packet fragmentation issues.</p></div>",
    "images": []

  {
    "id": 7,
    "q_en": "When troubleshooting an OSPF neighborship, you notice that the router stopped at the ExStart state. What is the cause of this result?",

      "A. The priority is set to 255.",
      "B. There is an interval timing mismatch.",
      "C. There is an area ID mismatch.",
      "D. There is an MTU mismatch."
    ],
    "answer": "D",
    "explanation": "<div class=\"explanation-body\"><p>When an OSPF (Open Shortest Path First) neighborship is stuck in the ExStart state, it usually points to a mismatch in Maximum Transmission Unit (MTU) settings between two routers trying to establish the adjacency. The ExStart state is where OSPF routers negotiate the master-slave relationship and exchange DBD (Database Description) packets.</p><p><strong>Step-by-Step Breakdown:</strong></p><ul><li><strong>OSPF Neighbor States:</strong> OSPF goes through several states to establish an adjacency: Down, Init, 2-Way, ExStart, Exchange, Loading, and Full.</li><li><strong>MTU Mismatch Issue:</strong> During the ExStart state, both OSPF routers must agree on their MTU values. If there is an MTU mismatch between the two routers, OSPF neighbors will fail to move from the ExStart to the Exchange state. The router with the larger MTU setting will not accept DBD packets from the router with a smaller MTU because the packets may exceed the smaller MTU size.</li><li>In Juniper devices, this behavior can be identified by examining the MTU settings using the <code>show interfaces</code> command. To resolve this, match the MTU settings or configure OSPF to ignore MTU mismatches using <code>set protocols ospf ignore-mtu</code>.</li></ul><p><strong>Juniper Reference:</strong> Junos Command: <code>show ospf neighbor</code> helps diagnose neighbor states. MTU Adjustment: <code>set interfaces &lt;interface-name&gt; mtu &lt;size&gt;</code> can be used to set the MTU values correctly.</p></div>",

    "explanation": "<div class=\"explanation-body\"><p>OSPF (Open Shortest Path First) calculates the best path based on the cost of the route, which is derived from the bandwidth of the interfaces along the path.</p><p><strong>Step-by-Step Breakdown:</strong></p><ul><li><strong>OSPF Path Selection:</strong> OSPF assigns a cost to each link, typically based on the link's bandwidth (higher bandwidth equals lower cost). The OSPF algorithm computes the shortest path to a destination by adding the costs of all links in the path. The path with the numerically lowest total cost is chosen as the best path.</li><li><strong>Cost Calculation:</strong> The OSPF cost can be manually adjusted or automatically calculated using the default formula: <code>Cost = Reference Bandwidth / Link Bandwidth</code>.</li></ul><p><strong>Juniper Reference:</strong> OSPF Best Path Selection: OSPF selects the path with the lowest cumulative cost, ensuring efficient use of higher-bandwidth links in Junos networks.</p></div>",

    "answer": "A",
    "explanation": "<div class=\"explanation-body\"><p>A MAC address of FF-FF-FF-FF-FF-FF is the Ethernet broadcast address. When a switch receives a frame with this destination MAC address, it is required to forward the frame to all interfaces except the one it was received on.</p><p><strong>Step-by-Step Breakdown:</strong></p><ul><li><strong>Broadcast Frame Handling:</strong> When a frame with the broadcast MAC address is received, the switch will flood it out of all active ports that belong to the same VLAN as the incoming frame. The broadcast frame is not sent back out of the ingress interface (the interface where the frame was originally received).</li><li><strong>Purpose of Flooding:</strong> Broadcasting is used to ensure that the frame reaches all devices within the broadcast domain (all devices within the same VLAN), which may not have a specific entry for the MAC address in their MAC address table.</li></ul><p><strong>Juniper Reference:</strong> Layer 2 Frame Forwarding: Juniper switches flood broadcast frames to all ports in the same VLAN, except the port the frame was received on.</p></div>",

    "explanation": "<div class=\"explanation-body\"><p>The BGP AS (Autonomous System) path attribute is crucial in path selection and loop prevention. Each BGP router appends its local AS number to the beginning of the AS path when it advertises a route to an external BGP (eBGP) peer.</p><p><strong>Step-by-Step Breakdown:</strong></p><ul><li><strong>AS Path Attribute:</strong> The AS path is a sequence of AS numbers that a route has traversed to reach a destination. Each AS adds its number to the front of the path, allowing BGP to track the route's history.</li><li><strong>Why the Local AS is Added at the Beginning:</strong> When advertising a route to an eBGP neighbor, a BGP router adds its own AS number to the beginning of the AS path. This ensures that the AS path reflects the route's journey accurately from the origin to the destination, and prevents loops in BGP. If the route returns to the same AS, the router will detect its AS number in the path and reject the route, preventing routing loops.</li><li><strong>Order of the AS Path:</strong> The order is significant because BGP uses it to select the best path. A shorter AS path is preferred, as it indicates fewer hops between the source and destination.</li></ul><p><strong>Juniper Reference:</strong> AS Path Attribute: Junos devices append the local AS at the start of the AS path before advertising the route to an external peer.</p></div>",

    "explanation": "<div class=\"explanation-body\"><p>In IBGP (Internal Border Gateway Protocol), all routers within the same AS (Autonomous System) must have a logical full-mesh topology. This means that every IBGP router must be able to communicate with every other IBGP router directly or indirectly to ensure proper route propagation.</p><p><strong>Step-by-Step Breakdown:</strong></p><ul><li><strong>Logical Full Mesh:</strong> In an IBGP setup, routers do not re-advertise routes learned from one IBGP peer to another IBGP peer. This rule is in place to prevent routing loops within the AS. To ensure full route propagation, a logical full mesh is required, meaning every IBGP router must peer with every other IBGP router in the AS. This can be done either directly or via route reflection or confederation.</li><li><strong>Physical Full Mesh Not Required:</strong> The physical topology does not need to be a full mesh, but the BGP peering relationships must form a logical full mesh. Techniques like route reflectors or BGP confederations can reduce the need for manual full-mesh peering.</li></ul><p><strong>Juniper Reference:</strong> IBGP Configuration: IBGP logical full mesh requirements can be simplified using route reflectors to avoid the complexity of manually configuring many IBGP peers.</p></div>",

    "explanation": "<div class=\"explanation-body\"><p>During a BGP Graceful Restart (GR), the receiving router (Helper) retains the routes learned from the restarting peer but marks them as \"stale\" rather than immediately deleting them.</p><p><strong>Step-by-Step Breakdown:</strong></p><ul><li><strong>Graceful Restart Mechanism:</strong> GR is designed to minimize traffic disruption when a BGP process restarts. If both peers support GR, the helper peer knows the other side is temporarily restarting its control plane.</li><li><strong>Stale Routes:</strong> The helper router marks the routes from the restarting router as stale. The forwarding plane continues to use these stale routes to forward packets, assuming the data plane of the restarting router is still intact.</li><li><strong>Cleanup:</strong> Once the restarting router comes back online and the BGP session is re-established, the routes are refreshed. If the session doesn't re-establish within a specific time limit (Restart Time), the stale routes are flushed from the routing table.</li></ul></div>",

    "explanation": "<div class=\"explanation-body\"><p>In OSPF, the Designated Router (DR) and Backup Designated Router (BDR) are elected on multi-access broadcast networks (like Ethernet) to optimize the exchange of routing information.</p><p><strong>Step-by-Step Breakdown:</strong></p><ul><li><strong>Adjacency Reduction:</strong> On a broadcast segment with multiple routers, forming a full mesh of adjacencies would require <code>n(n-1)/2</code> neighbor relationships, causing excessive OSPF traffic. By electing a DR and BDR, all other routers (DROthers) only form full adjacencies with the DR and BDR.</li><li><strong>LSA Flooding:</strong> DROthers send their Link-State Updates (LSUs) only to the DR/BDR (using multicast address 224.0.0.6). The DR then floods these updates to the rest of the segment (using multicast address 224.0.0.5), greatly reducing network overhead.</li></ul></div>",

    "explanation": "<div class=\"explanation-body\"><p>An IP fabric (commonly designed as a Spine-Leaf architecture) is built entirely on Layer 3 routing rather than Layer 2 switching.</p><p><strong>Step-by-Step Breakdown:</strong></p><ul><li><strong>Routing vs. Switching:</strong> In an IP fabric, every link between a leaf and a spine is a routed Layer 3 link. Loop prevention and topology discovery are handled by routing protocols (like BGP or OSPF), entirely eliminating the need for the Spanning Tree Protocol (STP).</li><li><strong>Load Sharing:</strong> Because the fabric uses Layer 3 protocols, it relies on Equal-Cost Multipath (ECMP) forwarding capabilities provided by the routing protocol to load-share traffic effectively across all available spine links.</li></ul></div>",

  },

    "explanation": "<div class=\"explanation-body\"><p>In the exhibit, R2 receives the same OSPF update from both R1 and R3. OSPF has mechanisms to prevent unnecessary processing of duplicate LSAs (Link-State Advertisements).</p><p><strong>Step-by-Step Breakdown:</strong></p><ul><li><strong>OSPF LSA Processing:</strong> OSPF uses LSAs to exchange link-state information between routers. When a router receives an LSA, it checks if it already has a copy of the LSA in its Link-State Database (LSDB).</li><li><strong>Duplicate LSAs:</strong> If R2 has already received and processed the update from R1, it will ignore the update from R3 because it already has the same LSA in its database. OSPF uses the concept of flooding, but it does not reprocess LSAs that it already knows about.</li><li><strong>R2 Behavior:</strong> R2 will keep the update from R1 (the first one it received) and will ignore the same LSA from R3, as it is already in the LSDB.</li></ul><p><strong>Juniper Reference:</strong> OSPF LSA Processing: Junos adheres to OSPF standards, ensuring that duplicate LSAs are not processed multiple times to avoid unnecessary recalculations.</p></div>",

    "explanation": "<div class=\"explanation-body\"><p>In OSPF, an Autonomous System can be divided into smaller logical groupings called \"areas.\"</p><p><strong>Step-by-Step Breakdown:</strong></p><ul><li><strong>Database Optimization:</strong> Every router in an OSPF area must maintain an identical Link-State Database (LSDB) representing the exact topology of that area. As the network grows, the LSDB and SPF algorithm calculations become resource-heavy.</li><li><strong>Traffic and Route Management:</strong> By defining multiple areas, network administrators can localize topology changes. The Area Border Router (ABR) can summarize routes, thereby hiding the detailed topology changes of one area from the rest of the network. This controls route advertisements, limits LSA flooding, and manages traffic overhead effectively.</li></ul></div>",

    "explanation": "<div class=\"explanation-body\"><p>OSPF uses a metric known as \"Cost\" to calculate the shortest path to a destination.</p><p><strong>Step-by-Step Breakdown:</strong></p><ul><li><strong>Cost Metric Calculation:</strong> By default, OSPF calculates the cost of an interface based on its bandwidth (Reference Bandwidth / Interface Bandwidth). Higher bandwidth links yield a lower cost.</li><li><strong>Path Preference:</strong> OSPF calculates the total cumulative cost to reach a destination. The algorithm strictly prefers the path with the <strong>lowest</strong> cumulative cost. Administrators can manually adjust the cost of an interface using <code>set protocols ospf area 0 interface &lt;name&gt; metric &lt;value&gt;</code> to artificially make a path more or less preferred.</li></ul></div>",

    "explanation": "<div class=\"explanation-body\"><p>Aggregate routes are summary routes created manually by an administrator to encompass a larger block of IP addresses.</p><p><strong>Step-by-Step Breakdown:</strong></p><ul><li><strong>Route Summarization:</strong> The primary purpose of aggregation is route summarization. By representing many specific subnets (e.g., several /24 networks) as one larger supernet (e.g., a single /16 network), the router advertises fewer routes to its neighbors.</li><li><strong>Benefits:</strong> This significantly reduces the size of the routing table, conserves memory and CPU cycles on downstream routers, and hides route flapping (if one specific subnet goes up and down, the aggregate route remains stable as long as at least one other contributing route remains active).</li></ul></div>",

    "explanation": "<div class=\"explanation-body\"><p>In Junos OS, a Routing Information Base (RIB) group is a configuration construct used to share routes between different routing tables.</p><p><strong>Step-by-Step Breakdown:</strong></p><ul><li><strong>Multiple Routing Tables:</strong> Junos maintains multiple routing tables, such as <code>inet.0</code> (primary IPv4 routing table) and routing tables belonging to specific routing instances (VRFs).</li><li><strong>Route Leaking/Sharing:</strong> A RIB group allows you to take routes learned from one protocol or routing instance and place them into multiple routing tables simultaneously. This is often used for \"route leaking\" between a VRF and the global routing table, or for sharing interface routes across instances.</li></ul></div>",

    "explanation": "<div class=\"explanation-body\"><p>The \"underlay\" in a data center fabric is the physical Layer 3 routing infrastructure. Its sole responsibility is to provide highly reliable and fast IP reachability between all nodes (Spines and Leafs).</p><p><strong>Step-by-Step Breakdown:</strong></p><ul><li><strong>Underlay Protocols:</strong> Interior Gateway Protocols (IGPs) like OSPF or IS-IS are traditional choices for building the underlay. In modern massive-scale data centers, eBGP (EBGP) has become the de-facto standard for the underlay due to its unparalleled scalability, policy control, and ease of troubleshooting.</li><li><strong>Overlay Protocols:</strong> EVPN and VXLAN are \"overlay\" technologies. They run on top of the IP reachability provided by the underlay (OSPF/eBGP) to create virtual Layer 2/Layer 3 tenant boundaries.</li></ul></div>",

    "explanation": "<div class=\"explanation-body\"><p>The BGP path selection algorithm relies on a strict sequence of attributes to determine the best path to a destination.</p><p><strong>Step-by-Step Breakdown:</strong></p><ul><li><strong>Initial Check:</strong> BGP first checks if the Next-Hop is reachable. If it is, the attribute evaluation begins. (Note: Cisco devices evaluate a proprietary \"Weight\" attribute first, but this is not applicable to Junos).</li><li><strong>Local Preference:</strong> In standard BGP implementations including Junos, the <strong>Local Preference</strong> attribute is evaluated first. A route with a higher Local Preference is immediately selected as the best path.</li><li><strong>Subsequent Checks:</strong> If Local Preferences are tied, BGP moves down the list: shortest AS Path length, then lowest Origin code, then lowest MED, etc.</li></ul></div>",

    "explanation": "<div class=\"explanation-body\"><p>A Virtual Local Area Network (VLAN) allows network administrators to logically segment a physical switch infrastructure.</p><p><strong>Step-by-Step Breakdown:</strong></p><ul><li><strong>Broadcast Domain Segmentation:</strong> Without VLANs, all ports on a switch reside in a single Layer 2 broadcast domain, meaning broadcast traffic (like ARP) is flooded out every port. VLANs segment the switch into multiple isolated broadcast domains.</li><li><strong>Security and Efficiency:</strong> By confining broadcast traffic to a specific VLAN, network congestion is reduced, and security is enhanced because devices in VLAN 10 cannot natively \"see\" or intercept Layer 2 traffic from VLAN 20 without going through a Layer 3 routing device.</li></ul></div>",

    "explanation": "<div class=\"explanation-body\"><p>Media Access Control Security (MACsec), defined in IEEE 802.1AE, operates at Layer 2 (the data-link layer) to secure Ethernet traffic point-to-point.</p><p><strong>Step-by-Step Breakdown:</strong></p><ul><li><strong>Layer 2 Security:</strong> Unlike IPsec which operates at Layer 3 and encrypts IP packets, MACsec encrypts the entire Ethernet frame (except the source/destination MAC addresses required for switching).</li><li><strong>Confidentiality and Integrity:</strong> By securing the link hop-by-hop, MACsec provides strong data confidentiality, prevents unauthorized snooping, protects data integrity, and mitigates man-in-the-middle and playback attacks on the physical wire.</li></ul></div>",

  },

    "explanation": "<div class=\"explanation-body\"><p>In networking and Junos OS terminology, \"Martian addresses\" refer to host or network addresses about which all routing information is ignored.</p><p><strong>Step-by-Step Breakdown:</strong></p><ul><li><strong>Security and Stability:</strong> Martian routes are IP addresses that should inherently never appear in the routing table or be routed across the public Internet. This includes addresses like <code>127.0.0.0/8</code> (loopback) or the <code>0.0.0.0/8</code> network.</li><li><strong>Junos Default Behavior:</strong> Junos OS maintains a default list of Martian addresses and automatically drops or ignores any routing updates containing them, protecting the network from invalid traffic routing or spoofing.</li></ul></div>",

    "q_en": "Which VLAN tagging method inserts a 4-byte tag into the Ethernet frame?",

    "answer": "B",
    "explanation": "<div class=\"explanation-body\"><p>The IEEE 802.1Q (Dot1Q) standard is the most common VLAN tagging method used in modern networks.</p><p><strong>Step-by-Step Breakdown:</strong></p><ul><li><strong>Frame Modification:</strong> When a frame is tagged using 802.1Q, a 32-bit (4-byte) tag is inserted into the original Ethernet frame header, right after the Source MAC address and before the EtherType field.</li><li><strong>Tag Contents:</strong> This 4-byte tag contains the Tag Protocol Identifier (TPID), Priority Code Point (PCP) for QoS, Drop Eligible Indicator (DEI), and a 12-bit VLAN Identifier (VID).</li><li><strong>ISL vs. Dot1Q:</strong> ISL is a Cisco-proprietary protocol that encapsulates the entire frame (adding 30 bytes), whereas Dot1Q modifies the existing frame header by inserting the 4-byte tag.</li></ul></div>",

    "explanation": "<div class=\"explanation-body\"><p>VLAN tagging is essential for maintaining logical network segmentation across physical links (trunk ports).</p><p><strong>Step-by-Step Breakdown:</strong></p><ul><li><strong>Identification:</strong> By adding a VLAN ID tag to Ethernet frames, switches can instantly identify which logical broadcast domain a frame belongs to as it traverses the network.</li><li><strong>Traffic Separation:</strong> This tag ensures that traffic from VLAN A is strictly separated from VLAN B on the same physical wire, allowing switches to enforce broadcast domain boundaries and preventing cross-VLAN communication without a Layer 3 routing device.</li></ul></div>",

        // Core Logic
        let currentIndex = 0;
        let selectedAnswers = []; 
        let isAnswered = false;
        let quizResults = {}; 
        let flaggedQuestions = new Set(); // 儲存被標記的題目 ID
        let isReversed = false;
        let isFirstLoad = true; // 新增：用於判斷是否為剛載入網頁

        // LOCALSTORAGE KEY
        const STORAGE_KEY = 'fcss_nse4_progress';

        // 產生目前的展示順序
        function buildDisplayOrder() {
            const arr = questionsData.map((_, i) => i);
            return isReversed ? arr.reverse() : arr;
        }
        let displayOrder = buildDisplayOrder();

        // 強制移除焦點，避免按鈕視覺卡住
        function blurFocus() {
            if (document.activeElement instanceof HTMLElement) {
                document.activeElement.blur();
            }
        }

        // 儲存進度到 LocalStorage
        function saveProgress() {
            const progressObj = {
                currentIndex: currentIndex,
                quizResults: quizResults,
                flaggedQuestions: Array.from(flaggedQuestions), // Set 轉 Array
                selectedAnswers: selectedAnswers,
                isAnswered: isAnswered,
                isReversed: isReversed
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(progressObj));
        }

        // 讀取進度從 LocalStorage
        function loadProgress() {
            const savedData = localStorage.getItem(STORAGE_KEY);
            if (savedData) {
                try {
                    const progressObj = JSON.parse(savedData);
                    currentIndex = progressObj.currentIndex !== undefined ? progressObj.currentIndex : 0;
                    quizResults = progressObj.quizResults || {};
                    if (progressObj.flaggedQuestions) {
                        flaggedQuestions = new Set(progressObj.flaggedQuestions);
                    }
                    selectedAnswers = progressObj.selectedAnswers || [];
                    isAnswered = progressObj.isAnswered || false;
                    isReversed = progressObj.isReversed || false;
                    displayOrder = buildDisplayOrder();
                } catch (error) {
                    console.error("載入進度失敗：", error);
                }
            }
        }

        const quizContent = document.getElementById('quiz-content');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const submitBtn = document.getElementById('submit-btn');
        const progressBar = document.getElementById('progress-bar');
        const currentProgress = document.getElementById('current-progress');
        const totalCount = document.getElementById('total-count');
        const footerControls = document.getElementById('footer-controls');

        // Palette Logic
        const paletteModal = document.getElementById('palette-modal');
        const paletteBackdrop = document.getElementById('palette-backdrop');
        const palettePanel = document.getElementById('palette-panel');
        const paletteGrid = document.getElementById('palette-grid');

        // ==== 鍵盤事件監聽 (快捷鍵實作) ====
        document.addEventListener('keydown', (e) => {
            // 避免在輸入框中觸發
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

            // 1-6 數字鍵選擇選項 A-F
            const keyMap = {'1': 'A', '2': 'B', '3': 'C', '4': 'D', '5': 'E', '6': 'F'};
            if (keyMap[e.key] && !isAnswered) {
                const optionIndex = e.key.charCodeAt(0) - 49; 
                const cards = document.querySelectorAll('.option-card');
                if (cards[optionIndex]) {
                    const currentQ = questionsData[displayOrder[currentIndex]];
                    const isMultiple = currentQ.answer.includes(',');
                    toggleOption(keyMap[e.key], isMultiple, cards[optionIndex]);
                }
            }

            // 左方向鍵: 上一題
            if (e.key === 'ArrowLeft') {
                prevQuestion();
            }
            
            // 右方向鍵: 下一題
            if (e.key === 'ArrowRight') {
                nextQuestion();
            }

            // Enter 鍵: 提交或下一題
            if (e.key === 'Enter') {
                // 若已經答完且在看結果頁面，阻止觸發
                if (document.getElementById('result-banner') && !document.getElementById('result-banner').classList.contains('hidden') && currentIndex === questionsData.length) return; 

                if (!isAnswered && !submitBtn.disabled) {
                    submitAnswer();
                } else if (isAnswered) {
                    nextQuestion();
                }
            }

            // M 鍵: 標記/取消標記本題
            if (e.key.toLowerCase() === 'm') {
                toggleFlag();
            }

            // N 鍵: 清除本題進度
            if (e.key.toLowerCase() === 'n') {
                clearCurrentQuestion();
            }
        });

        // Init
        document.addEventListener("DOMContentLoaded", () => {
            totalCount.innerText = questionsData.length + " Questions";
            loadProgress(); // 優先讀取進度
            
            // 根據讀取的 isReversed 更新 UI 排序按鈕狀態
            const btn = document.getElementById('order-btn');
            if (btn) {
                btn.innerHTML = isReversed
                    ? '<i class="fa-solid fa-arrow-up"></i> <span class="hidden sm:inline">逆序</span>'
                    : '<i class="fa-solid fa-arrow-down"></i> <span class="hidden sm:inline">正序</span>';
                btn.className = (isReversed
                    ? 'bg-pink-600 hover:bg-pink-700'
                    : 'bg-purple-600 hover:bg-purple-700') + ' text-white px-3 py-1.5 rounded-lg text-sm transition-colors flex items-center gap-2 shadow-sm font-medium';
            }

            updateStats();
            renderQuestion(currentIndex);
        });

        // 切換正序/逆序
        function toggleOrder() {
            blurFocus();
            isReversed = !isReversed;
            displayOrder = buildDisplayOrder();
            currentIndex = 0;
            const btn = document.getElementById('order-btn');
            if (btn) {
                btn.innerHTML = isReversed
                    ? '<i class="fa-solid fa-arrow-up"></i> <span class="hidden sm:inline">逆序</span>'
                    : '<i class="fa-solid fa-arrow-down"></i> <span class="hidden sm:inline">正序</span>';
                btn.className = (isReversed
                    ? 'bg-pink-600 hover:bg-pink-700'
                    : 'bg-purple-600 hover:bg-purple-700') + ' text-white px-3 py-1.5 rounded-lg text-sm transition-colors flex items-center gap-2 shadow-sm font-medium';
            }
            saveProgress();
            renderQuestion(currentIndex);
        }

        // 跳轉題號
        function promptJump() {
            blurFocus();
            const ans = prompt('跳到第幾題? (1-' + questionsData.length + ')', '1');
            if (ans === null) return;
            const n = parseInt(ans, 10);
            if (isNaN(n) || n < 1 || n > questionsData.length) {
                alert('題號必須介於 1 到 ' + questionsData.length);
                return;
            }
            const dataIdx = questionsData.findIndex(q => q.id === n);
            if (dataIdx < 0) {
                alert('找不到 Q' + n);
                return;
            }
            currentIndex = displayOrder.indexOf(dataIdx);
            saveProgress();
            renderQuestion(currentIndex);
        }

        // 標記本題 (Flag)
        function toggleFlag() {
            blurFocus();
            const currentQId = questionsData[displayOrder[currentIndex]].id;
            const btnFlag = document.getElementById('btn-flag');
            
            if (flaggedQuestions.has(currentQId)) {
                flaggedQuestions.delete(currentQId);
                btnFlag.classList.replace('bg-red-700', 'bg-red-500');
                btnFlag.innerHTML = '<i class="fa-regular fa-flag"></i> <span class="hidden sm:inline">標記本題</span>';
            } else {
                flaggedQuestions.add(currentQId);
                btnFlag.classList.replace('bg-red-500', 'bg-red-700');
                btnFlag.innerHTML = '<i class="fa-solid fa-flag"></i> <span class="hidden sm:inline">取消標記</span>';
            }
            
            updateStats();
            saveProgress();
            if (!paletteModal.classList.contains('hidden')) renderPaletteGrid();
        }

        // 尋找下一個標記
        function nextFlag() {
            blurFocus();
            if (flaggedQuestions.size === 0) { alert('目前沒有任何標記的題目。'); return; }
            for (let pos = currentIndex + 1; pos < questionsData.length; pos++) {
                if (flaggedQuestions.has(questionsData[displayOrder[pos]].id)) {
                    currentIndex = pos;
                    saveProgress();
                    renderQuestion(currentIndex);
                    return;
                }
            }
            // 若後面沒有，循環找最前面的
            for (let pos = 0; pos <= currentIndex; pos++) {
                if (flaggedQuestions.has(questionsData[displayOrder[pos]].id)) {
                    currentIndex = pos;
                    saveProgress();
                    renderQuestion(currentIndex);
                    return;
                }
            }
        }

        // 尋找上一個標記
        function prevFlag() {
            blurFocus();
            if (flaggedQuestions.size === 0) { alert('目前沒有任何標記的題目。'); return; }
            for (let pos = currentIndex - 1; pos >= 0; pos--) {
                if (flaggedQuestions.has(questionsData[displayOrder[pos]].id)) {
                    currentIndex = pos;
                    saveProgress();
                    renderQuestion(currentIndex);
                    return;
                }
            }
            // 若前面沒有，找最後面的
            for (let pos = questionsData.length - 1; pos >= currentIndex; pos--) {
                if (flaggedQuestions.has(questionsData[displayOrder[pos]].id)) {
                    currentIndex = pos;
                    saveProgress();
                    renderQuestion(currentIndex);
                    return;
                }
            }
        }

        // 清除本題進度
        function clearCurrentQuestion() {
            blurFocus();
            const currentQId = questionsData[displayOrder[currentIndex]].id;
            delete quizResults[currentQId];
            selectedAnswers = [];
            isAnswered = false;
            updateStats();
            saveProgress();
            renderQuestion(currentIndex);
        }

        // 更新左側統計數據
        function updateStats() {
            const total = questionsData.length;
            const answeredCount = Object.keys(quizResults).length;
            const correctCount = Object.values(quizResults).filter(r => r === true).length;
            const flaggedCount = flaggedQuestions.size;
            const percentage = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;

            document.getElementById('stat-progress').innerText = `${answeredCount} / ${total}`;
            document.getElementById('stat-flagged').innerText = flaggedCount;
            document.getElementById('stat-correct').innerText = correctCount;
            document.getElementById('stat-accuracy').innerText = `${percentage}%`;
        }

        function escapeHTML(s) { 
            if (!s) return '';
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); 
        }

        function renderQuestion(index) {
            const dataIdx = displayOrder[index];
            const q = questionsData[dataIdx];
            
            // 初始化狀態
            isAnswered = quizResults.hasOwnProperty(q.id);
            
            // 解決「下一題自動帶入上一題答案」的 Bug
            if (isFirstLoad) {
                // 如果是網頁剛載入的第一次渲染，保留由 loadProgress 取回的 selectedAnswers
                isFirstLoad = false;
            } else {
                // 只要是切換題目（不論上一題是否已送出），都必須清空選擇狀態，防止答案殘留
                selectedAnswers = []; 
            }

            // 更新標記按鈕 UI
            const btnFlag = document.getElementById('btn-flag');
            if (flaggedQuestions.has(q.id)) {
                btnFlag.classList.replace('bg-red-500', 'bg-red-700');
                btnFlag.innerHTML = '<i class="fa-solid fa-flag"></i> <span class="hidden sm:inline">取消標記</span>';
            } else {
                btnFlag.classList.replace('bg-red-700', 'bg-red-500');
                btnFlag.innerHTML = '<i class="fa-regular fa-flag"></i> <span class="hidden sm:inline">標記本題</span>';
            }

            document.getElementById('q-id-display').innerText = `第 ${index + 1} 題 (ID: Q${q.id})`;
            
            // Image Logic
            let exhibitHtml = '';
            if (q.images && q.images.length) {
                exhibitHtml = '<div class="my-6 flex flex-col items-center justify-center gap-4">';
                q.images.forEach((img, i) => {
                    const pid = 'placeholder-' + q.id + '-' + i;
                    exhibitHtml += `
                        <img src="png/${img}" alt="Exhibit ${i+1} for Q${q.id}" class="max-w-full h-auto rounded-lg border border-slate-300 shadow-sm" style="display:none" onload="this.style.display='block'" onerror="this.style.display='none'; document.getElementById('${pid}').classList.remove('hidden');">
                        <div id="${pid}" class="hidden w-full bg-slate-50 border-2 border-dashed border-slate-300 rounded-lg h-32 flex flex-col items-center justify-center text-slate-400 p-4 text-center">
                            <i class="fa-regular fa-image text-3xl mb-2"></i>
                            <span class="text-xs font-semibold mb-1">Q${q.id} Exhibit ${i+1} (png/${img})</span>
                            <span class="text-[10px]">To view the image, please ensure the file <b>${img}</b> is located in the <b>png</b> folder.</span>
                        </div>`;
                });
                exhibitHtml += '</div>';
            }

            // Options Logic - 動態計算正確答案數量
            const correctAnswersCount = q.answer.split(',').filter(s => s.trim() !== '' && s.trim() !== '—').length;
            const isMultiple = correctAnswersCount > 1;
            
            const typeText = isMultiple ? 
                `<span class="text-xs bg-slate-200 text-slate-600 px-2 py-0.5 rounded ml-2">Multiple Choice (需選 ${correctAnswersCount} 項)</span>` : 
                '<span class="text-xs bg-slate-200 text-slate-600 px-2 py-0.5 rounded ml-2">Single Choice</span>';

            let optionsHtml = q.options.map((opt, i) => {
                const letter = String.fromCharCode(65 + i); 
                
                let cleanOpt = opt.trim();
                const prefixRegex = new RegExp(`^${letter}[\\.\\)]?\\s*`);
                if (prefixRegex.test(cleanOpt)) {
                    cleanOpt = cleanOpt.replace(prefixRegex, '').trim();
                }

                // 處理 localStorage 還原的選中狀態
                let isSelected = selectedAnswers.includes(letter);
                let selectedClass = isSelected ? 'selected' : '';
                let indicatorHidden = isSelected ? '' : 'hidden';

                return `
                <div class="option-card border border-slate-200 rounded-lg p-4 mb-3 flex items-center gap-3 w-full ${selectedClass}" 
                     onclick="toggleOption('${letter}', ${isMultiple}, this)" data-letter="${letter}">
                    <div class="flex-shrink-0 w-6 h-6 rounded-full border-2 border-slate-300 flex items-center justify-center option-indicator bg-white">
                        <div class="w-3 h-3 ${isMultiple ? 'rounded-sm' : 'rounded-full'} bg-blue-500 ${indicatorHidden}"></div>
                    </div>
                    <div class="text-slate-700 text-sm md:text-base leading-relaxed select-none text-left flex-1 break-words">
                        <span class="font-bold mr-1 text-slate-500">${letter}.</span> ${escapeHTML(cleanOpt)}
                    </div>

            }).join('');

            // Render
            quizContent.innerHTML = `
                <div class="flex justify-between items-start mb-4 fade-in">
                    <span class="bg-slate-800 text-white text-sm font-bold px-3 py-1 rounded">第 ${index + 1} 題</span>
                    ${typeText}
                </div>
                
                <div class="mb-2 fade-in">
                    <p class="font-bold text-slate-800 text-lg md:text-xl mb-3 leading-snug question-text">${escapeHTML(q.q_en)}</p>

                <div class="fade-in">

                        <span class="font-bold text-green-700"><i class="fa-solid fa-check-circle mr-1"></i> Correct Answer:</span>

                        <span class="ml-2 text-sm text-slate-600">| Your answer: <span id="your-answer-display" class="font-semibold">(none)</span></span>
                    </div>
                    <div class="text-sm text-slate-700 leading-relaxed explanation-body">${q.explanation}</div>
                </div>
            `;

            footerControls.classList.remove('hidden');
            updateProgress();
            
            // 如果這題之前已經答過了，直接顯示結果狀態
            if (isAnswered) {
                document.getElementById('explanation-area').classList.remove('hidden');

                nextBtn.classList.remove('hidden');
                
                // 視覺上還原對錯狀態並鎖死
                const optionCards = document.querySelectorAll('.option-card');
                const correctAnswersArray = q.answer.split(',').map(s => s.trim());
                
                optionCards.forEach((card) => {
                    card.classList.add('disabled-click');
                    const letter = card.getAttribute('data-letter');
                    const indicator = card.querySelector('.option-indicator');
                    
                    if (correctAnswersArray.includes(letter)) {
                        card.classList.add('correct-answer');
                        indicator.innerHTML = '<i class="fa-solid fa-check text-green-600"></i>';
                        indicator.classList.remove('border-slate-300');
                        indicator.classList.add('border-green-500');
                    } else if (selectedAnswers.includes(letter)) {
                        card.classList.add('wrong-answer');
                        indicator.innerHTML = '<i class="fa-solid fa-xmark text-red-600"></i>';
                        indicator.classList.remove('border-slate-300');
                        indicator.classList.add('border-red-500');
                    }
                });

                // Update Your answer display
                const yourAns = document.getElementById('your-answer-display');
                if (yourAns) {
                    yourAns.textContent = selectedAnswers.length ? selectedAnswers.sort().join(', ') : '(none)';
                    yourAns.className = 'font-semibold ' + (quizResults[q.id] ? 'text-green-700' : 'text-red-700');
                }

                // Update Result Banner
                const banner = document.getElementById('result-banner');
                if (banner) {
                    if (quizResults[q.id]) {
                        banner.innerHTML = '<i class="fa-solid fa-circle-check mr-2"></i> 答對! Correct!';
                        banner.className = 'mb-4 p-3 rounded-lg font-bold text-lg text-center bg-green-200 text-green-800 border-2 border-green-500';
                    } else {
                        banner.innerHTML = '<i class="fa-solid fa-circle-xmark mr-2"></i> 答錯! Incorrect';
                        banner.className = 'mb-4 p-3 rounded-lg font-bold text-lg text-center bg-red-200 text-red-800 border-2 border-red-500';
                    }
                }
            } else {
                submitBtn.classList.remove('hidden');
                submitBtn.disabled = selectedAnswers.length !== correctAnswersCount; 
                nextBtn.classList.add('hidden');
            }

            nextBtn.innerHTML = 'Next <i class="fa-solid fa-arrow-right ml-2"></i>';
            nextBtn.className = "px-6 py-2 rounded-lg bg-slate-800 text-white hover:bg-slate-900 transition-colors hidden";
            prevBtn.disabled = index === 0;
            
            if(!paletteModal.classList.contains('hidden')){
                renderPaletteGrid();
            }
        }

        function toggleOption(letter, isMultiple, cardElement) {
            if (isAnswered) return;

            const q = questionsData[displayOrder[currentIndex]];
            const correctAnswersCount = q.answer.split(',').filter(s => s.trim() !== '' && s.trim() !== '—').length;
            const indicator = cardElement.querySelector('.option-indicator > div');
            
            if (isMultiple) {
                if (selectedAnswers.includes(letter)) {
                    selectedAnswers = selectedAnswers.filter(a => a !== letter);
                    cardElement.classList.remove('selected');
                    indicator.classList.add('hidden');
                } else {
                    if (selectedAnswers.length < correctAnswersCount) {
                        selectedAnswers.push(letter);
                        cardElement.classList.add('selected');
                        indicator.classList.remove('hidden');
                    } else {
                        return; // 達到上限
                    }
                }
            } else {
                selectedAnswers = [letter];
                document.querySelectorAll('.option-card').forEach(el => {
                    el.classList.remove('selected');
                    el.querySelector('.option-indicator > div').classList.add('hidden');
                });
                cardElement.classList.add('selected');
                indicator.classList.remove('hidden');
            }
            
            submitBtn.disabled = selectedAnswers.length !== correctAnswersCount;
            saveProgress(); // 選項改變時儲存狀態
        }

        function submitAnswer() {
            blurFocus();
            isAnswered = true;
            const q = questionsData[displayOrder[currentIndex]];
            const correctAnswers = q.answer.split(',').map(s => s.trim());

            const isCorrect = correctAnswers.length === selectedAnswers.length && 
                              correctAnswers.every(val => selectedAnswers.includes(val));
            
            quizResults[q.id] = isCorrect;
            updateStats();
            saveProgress();

            const optionCards = document.querySelectorAll('.option-card');
            optionCards.forEach((card) => {
                const letter = card.getAttribute('data-letter');
                const indicator = card.querySelector('.option-indicator');
                
                card.classList.add('disabled-click');
                
                if (correctAnswers.includes(letter)) {
                    card.classList.add('correct-answer');
                    indicator.innerHTML = '<i class="fa-solid fa-check text-green-600"></i>';
                    indicator.classList.remove('border-slate-300');
                    indicator.classList.add('border-green-500');
                } else if (selectedAnswers.includes(letter)) {
                    card.classList.add('wrong-answer');
                    indicator.innerHTML = '<i class="fa-solid fa-xmark text-red-600"></i>';
                    indicator.classList.remove('border-slate-300');
                    indicator.classList.add('border-red-500');
                }
            });

            const yourAns = document.getElementById('your-answer-display');
            if (yourAns) {
                yourAns.textContent = selectedAnswers.length ? selectedAnswers.sort().join(', ') : '(none)';
                yourAns.className = 'font-semibold ' + (isCorrect ? 'text-green-700' : 'text-red-700');
            }

            const banner = document.getElementById('result-banner');
            if (banner) {
                if (isCorrect) {
                    banner.innerHTML = '<i class="fa-solid fa-circle-check mr-2"></i> 答對! Correct!';
                    banner.className = 'mb-4 p-3 rounded-lg font-bold text-lg text-center bg-green-200 text-green-800 border-2 border-green-500';
                } else {
                    banner.innerHTML = '<i class="fa-solid fa-circle-xmark mr-2"></i> 答錯! Incorrect';
                    banner.className = 'mb-4 p-3 rounded-lg font-bold text-lg text-center bg-red-200 text-red-800 border-2 border-red-500';
                }
            }

            document.getElementById('explanation-area').classList.remove('hidden');
            submitBtn.classList.add('hidden');
            nextBtn.classList.remove('hidden');
            
            if (currentIndex === questionsData.length - 1) {
                nextBtn.innerHTML = 'View Results <i class="fa-solid fa-chart-pie ml-2"></i>';
                nextBtn.classList.remove('bg-slate-800', 'hover:bg-slate-900');
                nextBtn.classList.add('bg-indigo-600', 'hover:bg-indigo-700');
            }

            setTimeout(() => {
                document.getElementById('explanation-area').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 100);
        }

        function nextQuestion() {
            blurFocus();
            if (currentIndex < questionsData.length - 1) {
                currentIndex++;
                saveProgress();
                renderQuestion(currentIndex);
            } else {
                showResults();
            }
        }

        function prevQuestion() {
            blurFocus();
            if (currentIndex > 0) {
                currentIndex--;
                saveProgress();
                renderQuestion(currentIndex);
            }
        }

        function showResults() {
            const total = questionsData.length;
            const correctCount = Object.values(quizResults).filter(r => r === true).length;
            const answeredCount = Object.keys(quizResults).length;
            const percentage = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;
            
            let message = "";
            let colorClass = "";
            let icon = "";

            if (percentage === 100) {
                message = "Perfect! You are ready for the exam!";
                colorClass = "text-green-600";
                icon = "fa-trophy";
            } else if (percentage >= 80) {
                message = "Great job! Excellent score.";
                colorClass = "text-blue-600";
                icon = "fa-thumbs-up";
            } else if (percentage >= 60) {
                message = "Not bad, keep it up!";
                colorClass = "text-yellow-600";
                icon = "fa-star-half-stroke";
            } else {
                message = "Don't be discouraged, keep practicing!";
                colorClass = "text-red-600";
                icon = "fa-book-open-reader";
            }

            quizContent.innerHTML = `
                <div class="flex flex-col items-center justify-center h-full py-10 fade-in">
                    <div class="w-24 h-24 rounded-full bg-slate-100 flex items-center justify-center mb-6">
                        <i class="fa-solid ${icon} text-5xl ${colorClass}"></i>
                    </div>
                    
                    <h2 class="text-3xl font-bold text-slate-800 mb-2">Quiz Completed</h2>
                    
                    <div class="grid grid-cols-4 gap-4 w-full max-w-2xl mb-8 mt-6">
                        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-center">
                            <div class="text-slate-400 text-xs uppercase font-bold tracking-wider mb-1">Total</div>
                            <div class="text-2xl font-bold text-slate-800">${total}</div>
                        </div>
                        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-center">
                            <div class="text-slate-400 text-xs uppercase font-bold tracking-wider mb-1">Answered</div>
                            <div class="text-2xl font-bold text-slate-800">${answeredCount}</div>
                        </div>
                        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-center">
                            <div class="text-slate-400 text-xs uppercase font-bold tracking-wider mb-1">Correct</div>
                            <div class="text-2xl font-bold text-green-600">${correctCount}</div>
                        </div>
                        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-center">
                            <div class="text-slate-400 text-xs uppercase font-bold tracking-wider mb-1">Accuracy</div>
                            <div class="text-2xl font-bold ${colorClass}">${percentage}%</div>
                        </div>
                    </div>

                    <div class="bg-slate-50 border-l-4 border-slate-300 p-4 w-full max-w-lg mb-8 rounded-r text-slate-700 italic text-center">
                        "${message}"
                    </div>

                    <button onclick="restartQuiz()" class="px-8 py-3 rounded-full bg-slate-900 text-white font-bold hover:bg-slate-800 hover:scale-105 transition-all shadow-lg">
                        <i class="fa-solid fa-rotate-right mr-2"></i> Restart Quiz
                    </button>
                </div>
            `;

            footerControls.classList.add('hidden');
            progressBar.style.width = '100%';
        }

        function restartQuiz() {
            blurFocus();
            currentIndex = 0;
            quizResults = {};
            selectedAnswers = [];
            isAnswered = false;
            // 這裡不再呼叫 flaggedQuestions.clear()，所以標記會被保留下來
            progressBar.style.width = '0%';
            
            // 清空除標記以外的 LocalStorage 進度並重存
            saveProgress();
            
            updateStats();
            renderQuestion(currentIndex);
        }

        function updateProgress() {
            const pct = ((currentIndex + 1) / questionsData.length) * 100;
            progressBar.style.width = `${pct}%`;
            currentProgress.innerText = `Question ${currentIndex + 1}`;
        }

        // Palette Functions
        function togglePalette() {
            blurFocus();
            const isHidden = paletteModal.classList.contains('hidden');
            if (isHidden) {
                paletteModal.classList.remove('hidden');
                void palettePanel.offsetWidth;
                paletteBackdrop.classList.remove('opacity-0');
                palettePanel.classList.remove('translate-x-full');
                renderPaletteGrid();
            } else {
                paletteBackdrop.classList.add('opacity-0');
                palettePanel.classList.add('translate-x-full');
                setTimeout(() => {
                    paletteModal.classList.add('hidden');
                }, 300);
            }
        }

        function renderPaletteGrid() {
            paletteGrid.innerHTML = '';
            questionsData.forEach((q, index) => {
                const el = document.createElement('div');
                el.className = 'palette-item';
                el.innerText = q.id;
                
                let statusClass = 'neutral';
                if (index === currentIndex) {
                    statusClass = 'current';
                } else if (quizResults.hasOwnProperty(q.id)) {
                    statusClass = quizResults[q.id] ? 'correct' : 'wrong';
                }

                el.classList.add(statusClass);
                
                if (flaggedQuestions.has(q.id)) el.classList.add('flagged');

                el.onclick = () => {
                    currentIndex = index;
                    saveProgress();
                    renderQuestion(index);
                    togglePalette();
                };
                
                paletteGrid.appendChild(el);
            });
        }
    </script>
</body>
</html>
