<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跨裝置網頁記帳本 (Google Sheets 版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8 font-sans text-slate-800">
    <div class="max-w-5xl mx-auto space-y-6">
        
        <!-- 頁首 -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white p-6 rounded-xl shadow-sm border border-slate-100">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">雲端支出記帳本</h1>
                <p class="text-sm text-slate-500 mt-1">資料將自動同步至 Google 試算表</p>
            </div>
            <div class="text-right bg-blue-50 px-5 py-3 rounded-lg border border-blue-100 w-full md:w-auto">
                <div class="text-xs text-blue-600 font-medium">連線狀態</div>
                <div id="status" class="text-sm font-bold text-blue-700">準備就緒</div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- 記帳輸入表單 -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 h-fit lg:col-span-1">
                <h2 class="text-lg font-bold mb-4 text-slate-800">新增支出</h2>
                <form id="expenseForm" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">日期</label>
                        <input type="date" id="date" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">類別</label>
                            <select id="category" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                                <option value="餐飲食品">餐飲食品</option>
                                <option value="交通運輸">交通運輸</option>
                                <option value="服飾美容">服飾美容</option>
                                <option value="居住住房">居住住房</option>
                                <option value="娛樂休閒">娛樂休閒</option>
                                <option value="其他雜項">其他雜項</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">付款方式</label>
                            <select id="payment" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                                <option value="現金">現金</option>
                                <option value="悠遊卡">悠遊卡</option>
                                <option value="信用卡">信用卡</option>
                                <option value="LINE Pay">LINE Pay</option>
                                <option value="銀行轉帳">銀行轉帳</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">項目/明細</label>
                        <input type="text" id="title" placeholder="例：澎湃早餐店" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>

                    <div class="grid grid-cols-2 gap-3 bg-slate-50 p-3 rounded-lg border border-slate-100">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">幣別</label>
                            <select id="currency" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                                <option value="TWD 台幣">TWD 台幣</option>
                                <option value="JPY 日圓">JPY 日圓</option>
                                <option value="USD 美金">USD 美金</option>
                                <option value="EUR 歐元">EUR 歐元</option>
                                <option value="VND 越南盾">VND 越南盾</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">匯率</label>
                            <input type="number" id="exchangeRate" value="1" step="any" min="0.000001" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div class="col-span-2">
                            <label class="block text-xs font-semibold text-slate-600 mb-1">外幣/原始金額</label>
                            <input type="number" id="amount" min="0.01" step="0.01" placeholder="輸入金額" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div class="col-span-2 text-right">
                            <span class="text-xs text-slate-500">折合台幣：</span>
                            <span id="twdAmountDisplay" class="font-bold text-slate-800">NT$ 0</span>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">備註 (選填)</label>
                        <input type="text" id="note" placeholder="例：培根蛋餅+大冰奶" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>

                    <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg text-sm transition flex justify-center items-center gap-2">
                        <span>送出並同步至雲端</span>
                    </button>
                </form>
            </div>

            <div class="lg:col-span-2 space-y-6">
                <!-- 歷史區間查詢 -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-4">
                        <h2 class="text-lg font-bold text-slate-800">查詢歷史紀錄</h2>
                        <div class="flex items-center gap-2 w-full sm:w-auto">
                            <input type="date" id="searchStart" class="px-2 py-1.5 border rounded-md text-xs focus:ring-2 focus:ring-blue-500 outline-none w-full sm:w-auto">
                            <span class="text-slate-400 text-xs">至</span>
                            <input type="date" id="searchEnd" class="px-2 py-1.5 border rounded-md text-xs focus:ring-2 focus:ring-blue-500 outline-none w-full sm:w-auto">
                            <button id="searchBtn" class="bg-slate-800 hover:bg-slate-700 text-white px-3 py-1.5 rounded-md text-xs transition whitespace-nowrap">查詢</button>
                        </div>
                    </div>
                    
                    <div class="flex justify-between items-center bg-slate-50 p-3 rounded-lg border border-slate-100 mb-4">
                        <span class="text-sm font-medium text-slate-600">此區間台幣總花費：</span>
                        <span id="historyTotal" class="text-xl font-bold text-rose-600">NT$ 0</span>
                    </div>

                    <div class="overflow-x-auto max-h-80 overflow-y-auto">
                        <table class="w-full text-left text-sm whitespace-nowrap relative">
                            <thead class="bg-slate-50 text-slate-500 text-xs uppercase border-b sticky top-0">
                                <tr>
                                    <th class="py-2 px-3">日期</th>
                                    <th class="py-2 px-3">類別</th>
                                    <th class="py-2 px-3">項目</th>
                                    <th class="py-2 px-3">付款方式</th>
                                    <th class="py-2 px-3 text-right">外幣金額</th>
                                    <th class="py-2 px-3 text-right">台幣總額</th>
                                </tr>
                            </thead>
                            <tbody id="historyList" class="divide-y divide-slate-100">
                                <tr><td colspan="6" class="text-center py-6 text-slate-400 text-xs">請點擊查詢載入歷史資料</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- 本機暫存明細 (供確認用) -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                    <h2 class="text-lg font-bold text-slate-800 mb-4">最近輸入紀錄 (僅顯示本次作業)</h2>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm whitespace-nowrap">
                            <thead class="bg-slate-50 text-slate-500 text-xs uppercase border-b">
                                <tr>
                                    <th class="py-2 px-3">日期</th>
                                    <th class="py-2 px-3">類別</th>
                                    <th class="py-2 px-3">項目</th>
                                    <th class="py-2 px-3">付款方式</th>
                                    <th class="py-2 px-3 text-right">外幣金額</th>
                                    <th class="py-2 px-3 text-right">台幣總額</th>
                                </tr>
                            </thead>
                            <tbody id="recentList" class="divide-y divide-slate-100">
                                <tr><td colspan="6" class="text-center py-6 text-slate-400 text-xs">尚無新增紀錄</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. 替換為您的 Apps Script 網址
        // ==========================================
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbywxzHuGomu3OSLTNaIGWiSSZNC6xKBkpMMi0plgZKGurwiah4CHPd0Mep8HmOQR8g/exec'; 

        // 初始化日期與 DOM
        const todayStr = new Date().toISOString().split('T')[0];
        document.getElementById('date').value = todayStr;
        
        // 預設查詢區間為當月1號到今天
        const firstDayStr = todayStr.substring(0, 8) + '01';
        document.getElementById('searchStart').value = firstDayStr;
        document.getElementById('searchEnd').value = todayStr;

        const form = document.getElementById('expenseForm');
        const currencySelect = document.getElementById('currency');
        const rateInput = document.getElementById('exchangeRate');
        const amountInput = document.getElementById('amount');
        const twdDisplay = document.getElementById('twdAmountDisplay');
        const statusEl = document.getElementById('status');
        const submitBtn = document.getElementById('submitBtn');
        const recentList = document.getElementById('recentList');
        
        let recentEntries = [];

// 從瀏覽器記憶讀取歷史自訂匯率，若無則建立空物件
        let savedRates = JSON.parse(localStorage.getItem('user_exchange_rates')) || {};

        currencySelect.addEventListener('change', (e) => {
            const cur = e.target.value;
            
            if(cur.startsWith('TWD')) {
                rateInput.value = 1;
                rateInput.readOnly = true;
                rateInput.classList.add('bg-slate-100');
            } else {
                // 若有儲存過該外幣的匯率就自動帶入，否則保持空白讓您手動輸入
                rateInput.value = savedRates[cur] || ''; 
                rateInput.readOnly = false;
                rateInput.classList.remove('bg-slate-100');
            }
            calculateTWD();
        });

        amountInput.addEventListener('input', calculateTWD);
        rateInput.addEventListener('input', calculateTWD);

        function calculateTWD() {
            const amount = parseFloat(amountInput.value) || 0;
            const rate = parseFloat(rateInput.value) || 0;
            const twd = Math.round(amount * rate);
            twdDisplay.textContent = `NT$ ${twd.toLocaleString()}`;
            return twd;
        }

        // 送出表單 (POST)
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if(SCRIPT_URL === 'YOUR_GOOGLE_SCRIPT_WEB_APP_URL') {
                alert('請先在原始碼中填入您的 Google Apps Script 網址！');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '連線同步中...';
            statusEl.textContent = '資料傳送中...';
            statusEl.className = 'text-sm font-bold text-amber-600';

            const twdAmount = calculateTWD();
            const formData = {
                date: document.getElementById('date').value,
                category: document.getElementById('category').value,
                payment: document.getElementById('payment').value,
                title: document.getElementById('title').value,
                currency: currencySelect.value,
                originalAmount: amountInput.value,
                exchangeRate: rateInput.value,
                twdAmount: twdAmount,
                note: document.getElementById('note').value
            };

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(formData),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                const result = await response.json();

                if(result.status === 'success') {
                    statusEl.textContent = '同步成功';
                    statusEl.className = 'text-sm font-bold text-emerald-600';
                    addRecentEntry(formData);
                    
                    // === 新增這兩行：記憶本次送出的外幣匯率 ===
                    if (!formData.currency.startsWith('TWD')) {
                        savedRates[formData.currency] = formData.exchangeRate;
                        localStorage.setItem('user_exchange_rates', JSON.stringify(savedRates));
                    }
                    // ==========================================

                    document.getElementById('title').value = '';
                    amountInput.value = '';
                    document.getElementById('note').value = '';
                    calculateTWD();
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                console.error('Error:', error);
                statusEl.textContent = '同步失敗';
                statusEl.className = 'text-sm font-bold text-rose-600';
                alert('寫入失敗，請確認網址或權限設定。');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>送出並同步至雲端</span>';
            }
        });

        // 渲染最新寫入紀錄 (雙金額欄位)
        function addRecentEntry(data) {
            recentEntries.unshift(data);
            if(recentEntries.length > 5) recentEntries.pop(); 
            if(recentEntries.length === 1) recentList.innerHTML = '';
            
            const currencyCode = data.currency.split(' ')[0];
            const origAmt = parseFloat(data.originalAmount).toLocaleString();
            const twdAmt = data.twdAmount.toLocaleString();
            
            // 決定外幣欄位顯示內容
            const displayOrig = currencyCode === 'TWD' ? '-' : `${currencyCode} ${origAmt}`;

            const tr = document.createElement('tr');
            tr.className = 'hover:bg-slate-50 transition';
            tr.innerHTML = `
                <td class="py-2 px-3 text-slate-600 text-xs">${data.date}</td>
                <td class="py-2 px-3"><span class="bg-slate-100 text-slate-700 px-2 py-0.5 rounded text-xs">${data.category}</span></td>
                <td class="py-2 px-3 font-medium text-slate-800">${data.title}</td>
                <td class="py-2 px-3 text-slate-600 text-xs">${data.payment}</td>
                <td class="py-2 px-3 text-right text-slate-600 text-xs">${displayOrig}</td>
                <td class="py-2 px-3 text-right font-bold text-slate-900">NT$ ${twdAmt}</td>
            `;
            recentList.prepend(tr);
        }

        // ==========================================
        // 讀取歷史資料功能 (GET)
        // ==========================================
        const searchBtn = document.getElementById('searchBtn');
        const historyList = document.getElementById('historyList');
        const historyTotalEl = document.getElementById('historyTotal');

        searchBtn.addEventListener('click', async () => {
            if(SCRIPT_URL === 'YOUR_GOOGLE_SCRIPT_WEB_APP_URL') {
                alert('請先設定 SCRIPT_URL'); return;
            }

            const startDate = document.getElementById('searchStart').value;
            const endDate = document.getElementById('searchEnd').value;
            
            searchBtn.disabled = true;
            searchBtn.textContent = '載入中...';
            historyList.innerHTML = '<tr><td colspan="6" class="text-center py-6 text-slate-400 text-xs">正在從雲端讀取資料...</td></tr>';
            historyTotalEl.textContent = '計算中...';

            try {
                const response = await fetch(SCRIPT_URL); // GET request
                const result = await response.json();
                
                if(result.status !== 'success') throw new Error(result.message);

                let totalTwd = 0;
                let htmlStr = '';

                // 反轉陣列讓新日期在上面
                const records = result.data.reverse();

                records.forEach(row => {
                    // Google Sheets 回傳的日期可能是 YYYY/MM/DD 或 YYYY-MM-DD
                    const rowDate = (row['日期'] || '').replace(/\//g, '-');
                    
                    // 區間篩選
                    if(rowDate >= startDate && rowDate <= endDate) {
                        const twdAmtVal = parseFloat((row['折合台幣']||'').replace(/,/g, '')) || 0;
                        totalTwd += twdAmtVal;

                        const curCode = (row['幣別'] || '').split(' ')[0];
                        const origAmtVal = parseFloat((row['外幣金額']||'').replace(/,/g, '')) || 0;
                        const displayOrig = curCode === 'TWD' ? '-' : `${curCode} ${origAmtVal.toLocaleString()}`;

                        htmlStr += `
                            <tr class="hover:bg-slate-50 transition border-b border-slate-50 last:border-0">
                                <td class="py-2 px-3 text-slate-600 text-xs">${rowDate}</td>
                                <td class="py-2 px-3"><span class="bg-slate-100 text-slate-700 px-2 py-0.5 rounded text-xs">${row['類別'] || '-'}</span></td>
                                <td class="py-2 px-3 font-medium text-slate-800">${row['項目明細'] || '-'}</td>
                                <td class="py-2 px-3 text-slate-600 text-xs">${row['付款方式'] || '-'}</td>
                                <td class="py-2 px-3 text-right text-slate-600 text-xs">${displayOrig}</td>
                                <td class="py-2 px-3 text-right font-bold text-slate-900">NT$ ${twdAmtVal.toLocaleString()}</td>
                            </tr>
                        `;
                    }
                });

                if(htmlStr === '') {
                    historyList.innerHTML = '<tr><td colspan="6" class="text-center py-6 text-slate-400 text-xs">此區間無資料</td></tr>';
                } else {
                    historyList.innerHTML = htmlStr;
                }
                
                historyTotalEl.textContent = `NT$ ${totalTwd.toLocaleString()}`;

            } catch (error) {
                console.error(error);
                historyList.innerHTML = '<tr><td colspan="6" class="text-center py-6 text-rose-500 text-xs">讀取失敗，請確認程式碼是否已重新部署。</td></tr>';
                historyTotalEl.textContent = '錯誤';
            } finally {
                searchBtn.disabled = false;
                searchBtn.textContent = '查詢';
            }
        });
    </script>
</body>
</html>
